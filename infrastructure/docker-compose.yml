name: codemastery

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    # Approved third-party Community build for local development only.
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z@sha256:dde55ccc0bc9e65dc582c8e652d652eea1438c6e60d774524f4da15d7b26a900
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-codemastery}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$STORAGE_ACCESS_KEY" = "$$MINIO_ROOT_USER" ]; then
          printf '%s\n' 'Application storage identity must differ from MinIO root identity.' >&2
          exit 1
        fi
        # Bucket names must be safe to embed in the temporary policy JSON.
        case "$$STORAGE_BUCKET" in
          ''|*[!a-z0-9.-]*)
            printf '%s\n' 'Use a valid S3 bucket name for STORAGE_BUCKET.' >&2
            exit 1
            ;;
        esac
        work_dir=$$(mktemp -d)
        trap 'rm -rf "$$work_dir"' EXIT
        export MC_CONFIG_DIR="$$work_dir/config"
        policy_name=codemastery-local-storage
        run_mc() {
          if ! mc "$$@" >"$$work_dir/mc-output" 2>&1; then
            printf '%s\n' 'MinIO initialization failed; check service readiness and local configuration.' >&2
            exit 1
          fi
        }
        # Explicit API/path avoids probing before the server is ready.
        run_mc alias set --api S3v4 --path on local-admin http://minio:9000 \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        if ! timeout 120 mc ready local-admin >"$$work_dir/mc-output" 2>&1; then
          printf '%s\n' 'MinIO did not become ready within 120 seconds.' >&2
          exit 1
        fi
        run_mc mb --ignore-existing --region "$$STORAGE_REGION" "local-admin/$$STORAGE_BUCKET"
        run_mc admin user add local-admin "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        run_mc admin user enable local-admin "$$STORAGE_ACCESS_KEY"
        cat >"$$work_dir/policy.json" <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$STORAGE_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$$STORAGE_BUCKET/*"]
            }
          ]
        }
        EOF
        run_mc admin policy create local-admin "$$policy_name" "$$work_dir/policy.json"
        run_mc --json admin user info local-admin "$$STORAGE_ACCESS_KEY"
        policy_info=$$(cat "$$work_dir/mc-output")
        case "$$policy_info" in
          *'"memberOf":'*)
            printf '%s\n' 'Application identity must not inherit group policies.' >&2
            exit 1
            ;;
        esac
        case "$$policy_info" in
          *'"policyName":"codemastery-local-storage"'*) ;;
          *'"policyName":""'*)
            run_mc admin policy attach local-admin "$$policy_name" --user "$$STORAGE_ACCESS_KEY"
            ;;
          *'"policyName":'*)
            printf '%s\n' 'Unexpected application policy bindings; reconcile this local identity before startup.' >&2
            exit 1
            ;;
          *)
            # This MC release omits policyName when no policy is attached.
            run_mc admin policy attach local-admin "$$policy_name" --user "$$STORAGE_ACCESS_KEY"
            ;;
        esac
        run_mc alias set --api S3v4 --path on local-app http://minio:9000 \
          "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        run_mc ls "local-app/$$STORAGE_BUCKET"
        printf '%s\n' 'MinIO bucket and application identity initialized.'

  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env to match POSTGRES_DB locally}
      DB_USER: ${DB_USER:?Set DB_USER in .env to match POSTGRES_USER locally}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to match POSTGRES_PASSWORD locally}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PATH_STYLE_ACCESS: "true"
      STORAGE_BUCKET: ${STORAGE_BUCKET:-codemastery}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
