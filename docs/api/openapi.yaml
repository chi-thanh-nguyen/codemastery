        ],
        "description": "Implemented under AU07 (PR #239). Public; no bearer consumed; JSON only (other media types 415). Canonical CT01 email; same 202 for known/unknown/locked/full queue and while recovery delivery is unconfigured (then no lookup, capability or email). Auth FIFO capacity128, one worker; no lookup/SMTP on response path. Best-effort processing, no delivery guarantee. Active-account PT1M issuance interval; send only after commit. Real SMTP provider qualification, deployment binding and public exposure remain gated. ADR006 §9 is authoritative; §10 records gate status.",
