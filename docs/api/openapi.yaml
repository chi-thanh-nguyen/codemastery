  "openapi": "3.1.0",
  "info": {
    "title": "CodeMastery bounded Interim contracts",
    "version": "0.1.0",
    "description": "Scoped REST contracts. Selected Auth, public Course catalogue/detail and CT22.membership operations are implemented in PR #101, and the two AU07 password-recovery operations in PR #239; see docs/testing.md for executed evidence. FE07-2026-10-27-r1 is newly technically approved under explicit Leader delegation, pending protected integration. Existing effective approvals and remaining deferred slices are preserved in ADR001/ADR002; implementation does not establish protected merge or independent QA acceptance. ADR014 (16 November 2026, DELEGATED_APPROVED, implemented in the hybrid-authentication PR): login also starts a PostgreSQL refresh session and sets the HttpOnly refresh cookie; POST /api/auth/refresh rotates it and POST /api/auth/logout revokes it; every access JWT carries the session's sid claim."
  },
  "x-implementation-status": "SELECTED_OPERATIONS_IMPLEMENTED_IN_PR_101",
  "x-approval-reference": "../decisions/002-interim-delegated-contracts.md",
