  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Authorization: Bearer <accessToken> only. No URL/cookie token transport. ADR002 CT01.core fixes cryptography/current-account checks; ADR001 section 11 records CT01-2026-10-21-r1 delegated technical approval pending protected integration. This scheme alone is not an operation authorization policy. ADR014: the access JWT additionally carries the required sid claim of its refresh session and is rejected once that session is revoked or expired; it is still never transported in a cookie."
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-cm_refresh",
        "description": "ADR014 HttpOnly refresh cookie, used only by POST /api/auth/refresh and /api/auth/logout (and read by login for replacement). Secure, HttpOnly, SameSite=Strict, Path=/, no Domain. Value: 43-character unpadded base64url encoding of 32 random bytes; only its SHA-256 digest is stored. When every CORS_ALLOWED_ORIGINS entry is an HTTP loopback origin (local development) the name is cm_refresh and Secure is omitted. Never accepted by any other endpoint."
      }
    },
