  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Authorization: Bearer <accessToken> only. No URL/cookie token transport. ADR002 CT01.core fixes cryptography/current-account checks; ADR001 section 11 contains pending completion selections. This scheme alone is not an operation authorization policy."
      }
    },
    "schemas": {
      "PublicUser": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "Learner",
              "Instructor",
              "Administrator"
            ]
          }
        },
        "required": [
          "id",
          "displayName",
          "role"
        ]
      },
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "description": "Trim outer whitespace, ASCII lowercase, then validate ASCII email with no remaining whitespace; no provider dot/plus rewriting."
          },
          "password": {
            "type": "string",
            "writeOnly": true,
            "description": "Minimum15 Unicode code points, maximum72 UTF-8 bytes; never trim/normalize.",
            "minLength": 15,
            "x-max-utf8-bytes": 72
          },
          "displayName": {
            "type": "string",
            "description": "Trim first; resulting value nonblank, at most 100 Unicode code points and no control characters. Raw input length is not the trimmed-length predicate."
          }
        },
        "required": [
          "email",
          "password",
          "displayName"
        ]
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "description": "Trim outer whitespace, ASCII lowercase, then validate ASCII email with no remaining whitespace; no provider dot/plus rewriting."
          },
          "password": {
            "type": "string",
            "writeOnly": true,
            "description": "Exact untrimmed, unnormalized credential. Incorrect/over-72-byte candidates follow generic 401 with costly verification, never BCrypt truncation. Registration complexity rules are not a separate login error."
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "accessToken": {
            "type": "string",
            "description": "Sensitive bearer credential; never persist/log."
          },
          "tokenType": {
            "type": "string",
            "const": "Bearer"
          },
          "expiresIn": {
            "type": "integer",
            "const": 900
          },
          "user": {
            "$ref": "#/components/schemas/PublicUser"
          }
        },
        "required": [
          "accessToken",
          "tokenType",
          "expiresIn",
          "user"
        ]
      },
      "CourseSummary": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "instructorId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "id",
          "title",
          "description",
          "instructorId"
        ]
      },
      "SyllabusLesson": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "position": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "title",
          "position"
        ]
      },
      "SyllabusChapter": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "position": {
            "type": "integer",
            "minimum": 1
          },
          "lessons": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SyllabusLesson"
            }
          }
        },
        "required": [
          "id",
          "title",
          "position",
          "lessons"
        ]
      },
      "CourseDetail": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "instructorId": {
            "type": "string",
            "format": "uuid"
          },
          "prerequisiteDescription": {
            "type": [
              "string",
              "null"
            ]
          },
          "syllabus": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SyllabusChapter"
            }
          }
        },
        "required": [
          "id",
          "title",
          "description",
          "instructorId",
          "prerequisiteDescription",
          "syllabus"
        ]
      },
      "CoursePage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "content": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CourseSummary"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalElements": {
            "type": "integer",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "content",
          "page",
          "size",
          "totalElements",
          "totalPages"
        ]
      },
      "ProblemDetail": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "const": "about:blank"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string",
            "description": "Request path without query"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "field": {
                  "type": "string"
                },
                "code": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "field",
                "code",
                "message"
              ]
            }
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "instance"
        ],
        "additionalProperties": true
      }
    },
    "responses": {
      "ProtectedUnauthorized": {
        "description": "Protected operation: missing/invalid/expired bearer token or missing/locked current account. Authentication failed.; no business effects. Operation binding remains feature-contract owned.",
        "headers": {
          "WWW-Authenticate": {
            "$ref": "#/components/headers/BearerChallenge"
          },
          "Cache-Control": {
            "$ref": "#/components/headers/AuthenticationNoStore"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "ProtectedForbidden": {
        "description": "Protected operation: active authenticated account denied by its selected role/resource rule. Access is denied.; preserve session and produce no business effects. No implicit role inheritance.",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/AuthenticationNoStore"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      }
    },
    "headers": {
      "AuthenticationNoStore": {
        "description": "Do not store authentication/registration responses.",
        "schema": {
          "type": "string",
          "const": "no-store"
        }
      },
      "BearerChallenge": {
        "description": "Generic authentication challenge; never includes account or token details.",
        "schema": {
          "type": "string",
          "const": "Bearer"
        }
      }
    }
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
