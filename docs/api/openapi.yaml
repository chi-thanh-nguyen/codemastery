              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Session-bound access token for memory-only use; starts a refresh session and sets the HttpOnly refresh cookie (ADR014)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              },
              "Set-Cookie": {
                "$ref": "#/components/headers/RefreshCookieSet"
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              }
            }
          },
          "401": {
            "description": "Generic credential/account failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              },
              "WWW-Authenticate": {
                "$ref": "#/components/headers/BearerChallenge"
              }
            }
          },
          "403": {
            "description": "Untrusted cookie-operation origin: Origin not exactly one of CORS_ALLOWED_ORIGINS (required for refresh/logout, checked for login when present), cross-site Sec-Fetch-Site, or a navigation Sec-Fetch-Mode. CT18 'Access is denied.'",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              }
            }
          },
          "500": {
            "description": "Safe internal failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              }
            }
          }
        },
        "description": "Public operation; no bearer credential required or consumed. Use canonical email and exact password. Malformed/missing/typed-invalid fields or invalid email syntax: 400. Missing account, incorrect password or locked account: identical generic 401; never truncate over-72-byte candidates. ADR014: a successful login starts a new refresh session (7-day absolute, 24-hour idle), sets the refresh cookie and returns an access token bound to it through the sid claim. A refresh cookie still presented by the browser has its old session revoked; at most 10 active sessions per account are kept. The JSON request and response are unchanged."
      }
    },
    "/api/auth/refresh": {
      "post": {
        "operationId": "refreshSession",
        "security": [
          {
            "refreshCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Rotated session: a new access token for the same session (same sid) and a new refresh cookie; the presented token is consumed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              },
              "Set-Cookie": {
                "$ref": "#/components/headers/RefreshCookieSet"
              }
            }
          },
          "401": {
            "description": "Generic refusal: missing, malformed, ambiguous, unknown, expired, consumed or revoked refresh token, expired or revoked session, missing or locked account. Never sets or deletes the cookie. A token consumed 30 seconds ago or earlier is a replay and revokes its whole session first.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              },
              "WWW-Authenticate": {
                "$ref": "#/components/headers/BearerChallenge"
              }
            }
          },
          "403": {
            "description": "Untrusted cookie-operation origin: Origin not exactly one of CORS_ALLOWED_ORIGINS (required for refresh/logout, checked for login when present), cross-site Sec-Fetch-Site, or a navigation Sec-Fetch-Mode. CT18 'Access is denied.'",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              }
            }
          },
          "500": {
            "description": "Safe internal failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/AuthenticationNoStore"
              }
            }
          }
        },
        "description": "ADR014 rotation. No request body and no bearer credential are read; the HttpOnly refresh cookie is the only credential, sent with credentials only by the SPA. Requires a trusted Origin. Atomic under the session row lock: concurrent presentations of one token produce exactly one rotation."
      }
    },
