        "description": "Explicit per-Course policy: 0 < weak < mastered <= 1; positive n counts distinct valid bank Questions per skill, not questions per attempt. All keys required; no defaults. Reject duplicate/unknown keys, nulls, numeric strings and non-integers. No supplied concrete production/demo values."
