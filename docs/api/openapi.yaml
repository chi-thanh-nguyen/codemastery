    "/api/courses": {
      "get": {
        "operationId": "listPublishedCourses",
        "security": [],
        "description": "Published only; literal case-insensitive search and prerequisite filter are ANDed before paging/counting. Fixed title COLLATE C then UUID order. Unknown/duplicate query keys return 400. FE07-2026-10-27-r1 in ADR002.",
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "in": "query",
            "name": "size",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string",
              "default": "",
              "x-max-utf16-code-units": 100,
              "pattern": "^[^\\u0000]*$"
            },
            "description": "Trimmed case-insensitive literal substring of title or description; no SQL wildcard syntax. NUL (U+0000) is rejected with 400 before persistence. After trimming, the limit is 100 UTF-16 code units (Java String.length / HTML maxlength); supplementary characters count as two units, so 50 emoji fit and 51 do not. x-max-utf16-code-units expresses this application constraint; JSON Schema maxLength uses a different Unicode length metric and is intentionally absent."
          },
          {
            "in": "query",
            "name": "prerequisites",
            "schema": {
              "type": "string",
              "enum": [
                "any",
                "none",
                "described"
              ],
              "default": "any"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Published catalogue page",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CoursePage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid paging/query",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            }
          },
          "500": {
            "description": "Safe internal failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            }
          }
        },
        "x-ct03-reconciliation-reference": "../decisions/001-modular-monolith-module-boundaries.md#12-ct03-access-and-consumer-contract-reconciliation"
      }
    },
