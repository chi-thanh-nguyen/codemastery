      "put": {
        "operationId": "replaceCourseAdaptiveSettings",
        "tags": [
          "Batch 1 contracts"
        ],
        "description": "Conditional full replacement under ADR005 section 13: owning Instructor only, required If-Match (strong comparison), then optional If-None-Match (weak comparison), evaluated before effects against the same fresh guarded configuration under ADR005 section 16.1. Either failed condition is 412, never 304. Ignore If-Unmodified-Since when If-Match is present; ignore If-Modified-Since, Range and If-Range for this PUT. No pre-lock or post-write framework comparison may substitute for the guarded decision. Threshold changes permitted only before any submitted attempt and any stored mastery row; otherwise 409 with no replay. Same-policy toggles/n changes remain supported; every requested true requires fresh readiness. Settings use fail-fast admission on the same Course root (busy 409). No automatic retry, whole-Course recomputation or re-enable catch-up. Successful PUT returns the canonical body and no-store but MUST NOT include ETag, Last-Modified or other validator fields (RFC 9110 section 9.3.4; ADR005 section 15). Clients must subsequently GET the canonical body and its ETag before another update. Approved, not implemented.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "courseId",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "in": "header",
            "name": "If-Match",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "description": "Required entity-tag list from the settings GET. Any matching strong member passes; weak members never match. Missing 428; malformed/empty or wildcard * 400; nonmatching/weak-only 412. Evaluate fresh state under Course guard before history/readiness work or writes. This is expected-current-state semantics, not an ABA-proof revision. Evaluate before accompanying If-None-Match using the same freshly locked snapshot. Passing If-Match does not bypass If-None-Match."
          },
          {
            "in": "header",
            "name": "If-None-Match",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Optional entity-tag list or standalone *. After If-Match passes, weakly compare every listed tag against the same fresh guarded configuration; strong or weak current-tag match, or * for this existing representation, fails 412 without effects. Nonmatching/empty list passes this condition; RFC list/empty-element parsing applies. Mixed wildcard/list or malformed tag syntax is 400. Does not substitute for mandatory If-Match. Never 304 for PUT; refresh and explicitly review conditions, no automatic replay."
          }
        ],
        "responses": {
          "200": {
            "description": "Canonical settings committed. No ETag, Last-Modified or other validator is emitted for this transforming PUT. Perform GET to obtain a paired canonical representation and ETag before another update.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AdaptiveSettings"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Batch1Invalid"
          },
          "404": {
            "$ref": "#/components/responses/Batch1Unavailable"
          },
          "409": {
            "description": "Frozen threshold change, failed readiness or busy Course root; no effects, no automatic retry. Refresh and require explicit user review. No historical replay is approved.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            }
          },
          "500": {
            "description": "Safe provider/transaction/compatibility failure. Failures observed before commit roll back; indeterminate commit/response loss is not asserted to be rollback and must not be retried automatically. Refresh and reconcile current settings; no partial transaction is authorized.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/ProtectedUnauthorized"
          },
          "403": {
            "$ref": "#/components/responses/ProtectedForbidden"
          },
          "412": {
            "description": "Precondition Failed. The request preconditions are not satisfied. Fetch the current settings and review the request conditions before resubmitting. Failed If-Match or If-None-Match (including weak current-tag matches or *) produces no mutation, no current configuration or replacement ETag in the error; state need not have changed. Authentication/ownership/concealment precedence preserved; native safe ProblemDetail title/detail, no-store.",
            "headers": {
              "Cache-Control": {
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/ProblemDetail"
                }
              }
            }
          },
          "428": {
            "description": "Precondition Required. Fetch the current settings and supply If-Match. No changes; no current configuration or replacement ETag in the error. Authentication/ownership/concealment precedence preserved.",
            "headers": {
              "Cache-Control": {
                "required": true,
