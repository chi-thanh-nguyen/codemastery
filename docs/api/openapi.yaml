  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Authorization: Bearer <accessToken> only. No URL/cookie token transport. ADR002 CT01.core fixes cryptography/current-account checks; ADR001 section 11 records CT01-2026-10-21-r1 delegated technical approval pending protected integration. This scheme alone is not an operation authorization policy."
      }
    },
    "schemas": {
      "PublicUser": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "displayName": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "Learner",
              "Instructor",
              "Administrator"
            ]
          }
        },
        "required": [
          "id",
          "displayName",
          "role"
        ]
      },
      "RegisterRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "description": "Trim outer whitespace, ASCII lowercase, then validate ASCII email with no remaining whitespace; no provider dot/plus rewriting."
          },
          "password": {
            "type": "string",
            "writeOnly": true,
            "description": "Minimum15 Unicode code points, maximum72 UTF-8 bytes; never trim/normalize.",
            "minLength": 15,
            "x-max-utf8-bytes": 72
          },
          "displayName": {
            "type": "string",
            "description": "Trim first; resulting value nonblank, at most 100 Unicode code points and no control characters. Raw input length is not the trimmed-length predicate."
          }
        },
        "required": [
          "email",
          "password",
          "displayName"
        ]
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "description": "Trim outer whitespace, ASCII lowercase, then validate ASCII email with no remaining whitespace; no provider dot/plus rewriting."
          },
          "password": {
            "type": "string",
            "writeOnly": true,
            "description": "Exact untrimmed, unnormalized credential. Incorrect/over-72-byte candidates follow generic 401 with costly verification, never BCrypt truncation. Registration complexity rules are not a separate login error."
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "accessToken": {
            "type": "string",
            "description": "Sensitive bearer credential; never persist/log."
          },
          "tokenType": {
            "type": "string",
            "const": "Bearer"
          },
          "expiresIn": {
            "type": "integer",
            "const": 900
          },
          "user": {
            "$ref": "#/components/schemas/PublicUser"
          }
        },
        "required": [
          "accessToken",
          "tokenType",
          "expiresIn",
          "user"
        ]
      },
      "CourseSummary": {
        "type": "object",
        "additionalProperties": false,
