    "/api/me/courses": {
      "get": {
        "operationId": "getMyCourses",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "Paged current learner published memberships, with selected status filter. Learner only; authentication then role then visibility. See ADR002 FE07-2026-10-27-r1. CO07 (#173): status tells in-progress Courses (active) from completed Courses (completed); completed is the stored membership status that CT22.progress sets when every published Lesson is complete (ADR006 §3), and this read never recalculates it. Progress figures stay in GET /api/me/course-progress; this payload is unchanged.",
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "in": "query",
            "name": "size",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "in": "query",
            "name": "status",
            "schema": {
              "type": "string",
              "enum": [
                "joined",
                "active",
                "completed",
                "left",
                "all"
              ],
              "default": "joined"
