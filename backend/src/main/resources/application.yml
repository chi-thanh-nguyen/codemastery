# CodeMastery backend configuration.
#
# Rules:
#  - Secrets (DB password, JWT secret, storage keys) have NO committed default value.
#    AppConfig validates active datasource inputs before initialization. Its lazy
#    JWT/CORS/scheduler settings validate when injected by a consumer; unused optional
#    integrations do not become startup requirements. Quiz expiry is explicitly required,
#    including when disabled (ADR007 §3.2). Never commit real values.
#  - Every variable used here must be listed with a placeholder in the root .env.example.
#  - Environment variables always take precedence over this file.

spring:
  application:
    name: codemastery-backend

  config:
    # Local development convenience: load the (untracked) root .env file when it exists.
    # Follow the shared Spring/Compose value format in docs/setup.md. Absent files are ignored.
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codemastery}
    username: ${DB_USER:codemastery}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false            # data access stays inside the application/infrastructure layers
    hibernate:
      ddl-auto: validate           # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}      # slides, attachments, assignment submissions
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never         # fallback errors must not expose exception diagnostics
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      # Optional recovery delivery must never make the backend unhealthy or probe SMTP.
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.codemastery: ${LOG_LEVEL_APP:INFO}
  pattern:
    # CorrelationIdFilter must put the request id into the MDC under the key "correlationId".
    correlation: "[%X{correlationId:-}] "

codemastery:
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}            # tests can disable background schedulers

  security:
    jwt:
      secret: ${JWT_SECRET}                        # consumed JWT: exactly 64 hexadecimal characters
      issuer: codemastery
      expiration: ${JWT_EXPIRATION:PT15M}          # CT38.core: consumed JWT lifetime must equal PT15M
    password-reset:
      # AU07 recovery delivery is optional: when any value below is missing, a placeholder
      # or invalid, recovery stays inactive (no token, no email) and the rest of the
      # backend starts normally. SMTP uses port 587 with mandatory STARTTLS (fixed in code).
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}   # CT02-TOKEN-2026-11-09-r1: must equal PT30M
      frontend-origin: ${PASSWORD_RESET_FRONTEND_ORIGIN:}
      email-from: ${PASSWORD_RESET_EMAIL_FROM:}
      smtp-host: ${SMTP_HOST:}
      smtp-username: ${SMTP_USERNAME:}
      smtp-password: ${SMTP_PASSWORD:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}   # comma-separated

  storage:
    # MinIO through its S3-compatible API (slides, attachments, submissions). Videos are external links.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:codemastery}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}

  interaction:
    deadline-reminder:
      fixed-delay: ${DEADLINE_REMINDER_DELAY:PT15M}       # how often upcoming deadlines are checked
      lead-time: ${DEADLINE_REMINDER_LEAD_TIME:PT24H}     # notify when a deadline is closer than this

# ADR007 §3.2: explicit operator inputs, validated even when disabled; no production defaults.
app:
  quiz:
    auto-submit:
      enabled: ${APP_QUIZ_AUTO_SUBMIT_ENABLED}
      delay-ms: ${APP_QUIZ_AUTO_SUBMIT_DELAY_MS}
      batch-size: ${APP_QUIZ_AUTO_SUBMIT_BATCH_SIZE}

---
# Production / deployed VM: structured (ECS JSON) logs for operational use.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      console: ecs
