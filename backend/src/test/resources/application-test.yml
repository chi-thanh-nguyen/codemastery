codemastery:
  scheduling:
    enabled: false

  security:
    # Synthetic, non-routable recovery inputs so integration tests exercise active
    # recovery; delivery itself is replaced by a test double where it is observed.
    password-reset:
      frontend-origin: https://codemastery.test
      email-from: auth@codemastery.test
      smtp-host: smtp.codemastery.test
      smtp-username: test-smtp-user
      smtp-password: test-smtp-password

# Explicit test-case values; disabled in the shared suite, activated only by focused scheduler tests.
app:
  quiz:
    auto-submit:
      enabled: false
      delay-ms: 1000
      batch-size: 2
