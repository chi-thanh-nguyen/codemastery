name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.stage == 'promote'
          && format('Release admission and promotion: {0} -> {1}', inputs.candidate, inputs.version)
          || format('Release candidate: {0}', inputs.revision || github.sha))
      || format('Release rehearsal: {0}', github.event.pull_request.title) }}

# Phase 4 release pipeline (ADR015): candidate -> qualification -> security
# admission -> release promotion. Implementation: infrastructure/release/.
#
# - stage=candidate (manual, from main): builds the five linux/amd64 candidates
#   from a revision on main whose required checks' latest authenticated
#   evaluation passed (ADR015 D2, amendment A2), qualifies the exact
#   images, scans them, packages the evidence, attests the package (GitHub
#   artifact attestation, Sigstore) and stores it in a DRAFT release.
# - stage=promote (manual, from main; ADR015 A1): the security admission and the
#   promotion of one candidate. The admission authority dispatches it naming the
#   candidate draft, the SHA-256 of the release-candidate.json it reviewed, the
#   release version and the number of findings it accepts; the `admission request`
#   job authenticates the dispatcher and shows the verified candidate; the
#   promote job waits for the authority's approval in the protected
#   `release-admission` environment, records and attests the admission (bound to
#   this run), then verifies the candidate's attestation and every admitted
#   identity, rescans, promotes the admitted images to the
#   codemastery.invalid/*:release names, runs deploy.sh on the release archive and
#   stores the attested package in a DRAFT release. No admission PR is needed.
# - pull_request: an unprivileged rehearsal of both stages with a synthetic
#   REHEARSAL admission that authenticates nobody; no attestation, upload or release.
#
# The workflow never publishes a release, creates a tag, pushes an image,
# uploads a workflow artifact (the repository is public) or contacts a VM.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'candidate or promote'
        type: choice
        options: [candidate, promote]
        required: true
      revision:
        description: 'candidate: full commit SHA on main (empty = the dispatched main commit)'
        required: false
        default: ''
      public_origin:
        description: 'candidate: the single HTTPS origin baked into the frontend (ADR009 L2)'
        required: false
        default: 'https://codemastery.app'
      compatibility_baseline:
        description: 'candidate (optional): full SHA whose Flyway migrations a target may already hold'
        required: false
        default: ''
      candidate:
        description: 'promote: candidate draft tag (candidate-<12 hex>-<run>-<attempt>)'
        required: false
        default: ''
      candidate_manifest_sha256:
        description: 'promote: SHA-256 of the release-candidate.json you reviewed'
        required: false
        default: ''
      version:
        description: 'promote: release version to create as a draft (v<major>.<minor>.<patch>[-pre])'
        required: false
        default: ''
      accepted_findings:
        description: 'promote: number of candidate findings you accept (must equal the candidate count)'
        required: false
        default: ''
      accept_critical_or_high:
        description: 'promote: also accept CRITICAL/HIGH findings (refused otherwise)'
        type: boolean
        required: false
        default: false
      note:
        description: 'promote (optional): your risk-acceptance statement, one line, recorded in the admission'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'infrastructure/release/**'
      - 'infrastructure/vm/**'
      - 'infrastructure/minio/**'
      - 'infrastructure/postgres/**'
      - 'infrastructure/docker-compose.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'

permissions:
  contents: read

concurrency:
  # Dispatched stages run one at a time and a running stage is never cancelled
  # (GitHub keeps one pending dispatch; a newer one replaces it). A newer push
  # cancels an older rehearsal of the same pull request.
  group: ${{ github.event_name == 'pull_request' && format('release-rehearsal-{0}', github.event.pull_request.number) || 'release-dispatch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check script syntax and run the release tooling unit tests
        shell: bash
        run: |
          set -euo pipefail
          for script in infrastructure/release/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s infrastructure/release/tests -v

  rehearsal:
    name: Release rehearsal
    if: github.event_name == 'pull_request'
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable the containerd image store
        shell: bash
        run: bash infrastructure/release/release.sh enable-containerd-store
      # Source-free BuildKit layers only; PR cache writes remain scoped to the PR.
      - name: Restore Maven dependency layers
        id: maven-layer
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/maven-layer
          key: maven-layer-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Dockerfile', 'backend/pom.xml', 'backend/.mvn/**') }}
      - name: Prepare Maven dependency layers
        timeout-minutes: 10
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/maven-layer/index.json" ]]; then
            # This isolated builder exports a standard local cache, independently
            # of the runner's Docker image store. Ordinary consumers import it.
            builder="maven-cache-${GITHUB_JOB}"
            docker buildx create --name "$builder" --driver docker-container
            trap 'docker buildx rm "$builder" >/dev/null' EXIT
            docker buildx build --builder "$builder" --platform linux/amd64 \
              --target maven-dependencies --output type=cacheonly \
              --cache-to "type=local,dest=$RUNNER_TEMP/maven-layer,mode=max" backend
          fi
          echo "CODEMASTERY_MAVEN_LAYER_CACHE=$RUNNER_TEMP/maven-layer" >> "$GITHUB_ENV"
      - name: Build, qualify, scan and package a rehearsal candidate
        shell: bash
        run: |
          set -euo pipefail
          bash infrastructure/release/release.sh candidate-package "$PWD" "$RUNNER_TEMP/candidate" \
            "$(git rev-parse HEAD)" https://codemastery.app true
      - name: Admission refusals against the real candidate manifest
        shell: bash
        run: bash infrastructure/release/release.sh rehearsal-admission refusals "$RUNNER_TEMP/candidate" "$PWD"
      - name: Promote with a synthetic REHEARSAL admission and run deploy.sh on the release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admission"
          admission="$(bash infrastructure/release/release.sh rehearsal-admission create "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/admission")"
          bash infrastructure/release/release.sh release-package "$RUNNER_TEMP/candidate" "$PWD" \
            "$RUNNER_TEMP/release" "$admission" true "$PWD"
      - name: Summarize the rehearsal
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 infrastructure/release/release.py summary "$RUNNER_TEMP" REHEARSAL | tee -a "$GITHUB_STEP_SUMMARY" || true

  candidate:
    name: Release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'candidate'
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write        # draft release only
      checks: read           # required checks of the source revision
      actions: read          # GitHub's workflow run and job records that authenticate them
      pull-requests: read    # the merged pull request of the source revision
      id-token: write        # Sigstore signing identity for the attestation
      attestations: write
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release stages run only from main." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false   # the token is passed only to the steps that call the API
      - name: Resolve and verify the source revision
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_BASELINE: ${{ inputs.compatibility_baseline }}
          INPUT_ORIGIN: ${{ inputs.public_origin }}
        working-directory: tooling
        run: |
          set -euo pipefail
          rev="${INPUT_REVISION:-$GITHUB_SHA}"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "revision must be a full lowercase commit SHA." >&2; exit 1; }
          [[ -z "$INPUT_BASELINE" || "$INPUT_BASELINE" =~ ^[0-9a-f]{40}$ ]] || { echo "compatibility_baseline must be a full SHA." >&2; exit 1; }
          [[ "$INPUT_ORIGIN" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]] || { echo "public_origin is malformed." >&2; exit 1; }
          git merge-base --is-ancestor "$rev" origin/main || { echo "The revision is not on main." >&2; exit 1; }
          # ADR015 D2 (A2): the latest valid evaluation of every required check must have
          # passed, authenticated against GitHub's workflow run and job records. The first
          # reads decide; the merged pull request head's and the revision's check runs and,
          # last, the workflow runs are read again, and any change under a required name
          # refuses the revision. The second workflow-run read is the evidence cutoff.
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/rules.json"
          git ls-tree --name-only "$rev" .github/workflows/ > "$RUNNER_TEMP/workflow-files.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$rev&per_page=100" > "$RUNNER_TEMP/workflow-runs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$rev/check-runs?per_page=100&filter=all" > "$RUNNER_TEMP/check-runs.json"
          mkdir -p "$RUNNER_TEMP/jobs"
          python3 -c 'import json,sys; [print(r["id"], r["run_attempt"]) for p in json.load(open(sys.argv[1])) for r in p["workflow_runs"]]' \
            "$RUNNER_TEMP/workflow-runs.json" > "$RUNNER_TEMP/run-attempts.txt"
          while read -r run attempt; do
            [[ "$run" =~ ^[0-9]+$ && "$attempt" =~ ^[0-9]+$ ]] || { echo "Malformed workflow run record." >&2; exit 1; }
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/jobs/$run.attempt.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/jobs/$run.all.json"
          done < "$RUNNER_TEMP/run-attempts.txt"
          # GitHub reports the CodeQL code-scanning check only on pull requests:
          # also read the merged pull request whose merge commit is the revision.
          gh api "repos/$GITHUB_REPOSITORY/commits/$rev/pulls" > "$RUNNER_TEMP/pulls.json"
          head="$(python3 -c 'import json,sys; p=[x for x in json.load(open(sys.argv[1])) if x.get("merged_at") and x.get("merge_commit_sha")==sys.argv[2] and x["base"]["ref"]=="main"]; print(p[0]["head"]["sha"] if len(p)==1 else "")' "$RUNNER_TEMP/pulls.json" "$rev")"
          pr_args=()
          if [[ -n "$head" ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100&filter=all" > "$RUNNER_TEMP/pr-check-runs.json"
            pr_args=(--pulls "$RUNNER_TEMP/pulls.json" --pr-head "$head" --pr-check-runs "$RUNNER_TEMP/pr-check-runs.json"
                     --pr-check-runs-after "$RUNNER_TEMP/pr-check-runs-after.json"
                     --revision-tree "$(git rev-parse "$rev^{tree}")"
                     --pr-head-tree "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)")
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100&filter=all" > "$RUNNER_TEMP/pr-check-runs-after.json"
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$rev/check-runs?per_page=100&filter=all" > "$RUNNER_TEMP/check-runs-after.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$rev&per_page=100" > "$RUNNER_TEMP/workflow-runs-after.json"
          python3 infrastructure/release/release.py evaluate-checks --revision "$rev" --rules "$RUNNER_TEMP/rules.json" \
            --check-runs "$RUNNER_TEMP/check-runs.json" --check-runs-after "$RUNNER_TEMP/check-runs-after.json" \
            --workflow-files "$RUNNER_TEMP/workflow-files.txt" \
            --workflow-runs "$RUNNER_TEMP/workflow-runs.json" --workflow-runs-after "$RUNNER_TEMP/workflow-runs-after.json" \
            --jobs-dir "$RUNNER_TEMP/jobs" "${pr_args[@]}" > "$RUNNER_TEMP/source-checks.json"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "tag=candidate-${rev:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$GITHUB_WORKSPACE/source" "$rev"
      - name: Enable the containerd image store
        shell: bash
        run: bash tooling/infrastructure/release/release.sh enable-containerd-store
      - name: Build, qualify, scan and package the candidate
        shell: bash
        env:
          REV: ${{ steps.source.outputs.revision }}
          INPUT_ORIGIN: ${{ inputs.public_origin }}
          INPUT_BASELINE: ${{ inputs.compatibility_baseline }}
        run: |
          set -euo pipefail
          bash tooling/infrastructure/release/release.sh candidate-package "$GITHUB_WORKSPACE/source" \
            "$RUNNER_TEMP/candidate" "$REV" "$INPUT_ORIGIN" false "$RUNNER_TEMP/source-checks.json" "$INPUT_BASELINE"
      - name: Attest the candidate package
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/candidate/SHA256SUMS
      - name: Store the candidate in a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          REV: ${{ steps.source.outputs.revision }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 0644 "$BUNDLE" "$RUNNER_TEMP/release-candidate.sigstore.json"
          python3 tooling/infrastructure/release/release.py summary "$RUNNER_TEMP" CANDIDATE > "$RUNNER_TEMP/notes.md"
          bash tooling/infrastructure/release/release.sh draft-create "$TAG" "$REV" "Candidate ${REV:0:12} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}) - NOT ADMITTED" \
            "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/release-candidate.sigstore.json"
      - name: Summarize the candidate
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tooling/infrastructure/release/release.py summary "$RUNNER_TEMP" CANDIDATE | tee -a "$GITHUB_STEP_SUMMARY" || true

  request:
    name: Admission request
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'promote'
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # drafts are readable only with write access; nothing is written
      actions: read          # GitHub's record of this run
      attestations: read
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release stages run only from main." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
      - name: Authenticate the dispatching account
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: tooling
        run: |
          set -euo pipefail
          # Inputs are read from GitHub's event payload by release.py, never interpolated here.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          python3 infrastructure/release/release.py admission-request --event "$GITHUB_EVENT_PATH" \
            --run-record "$RUNNER_TEMP/run.json" --output "$RUNNER_TEMP/dispatch.json"
      - name: Show the verified candidate the approval would admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: tooling
        run: |
          set -euo pipefail
          read -r tag version < <(python3 -c 'import json,sys; r=json.load(open(sys.argv[1]))["request"]; print(r["candidate"], r["version"])' "$RUNNER_TEMP/dispatch.json")
          bash infrastructure/release/release.sh version-unused "$version"
          # Only the manifest and its bundle: the manifest is an attestation subject and
          # names every other file's digest. The promote job verifies the whole package.
          bash infrastructure/release/release.sh draft-download "$tag" "$RUNNER_TEMP/candidate" release-candidate.json release-candidate.sigstore.json
          cd "$RUNNER_TEMP/candidate"
          tooling_sha="$(python3 -c 'import json; print(json.load(open("release-candidate.json"))["tooling"]["sha"])')"
          [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "The candidate manifest names no tooling commit." >&2; exit 1; }
          gh attestation verify release-candidate.json --repo "$GITHUB_REPOSITORY" --bundle release-candidate.sigstore.json \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --source-ref refs/heads/main --source-digest "$tooling_sha" --deny-self-hosted-runners >/dev/null
          python3 "$GITHUB_WORKSPACE/tooling/infrastructure/release/release.py" admission-preview \
            --dispatch "$RUNNER_TEMP/dispatch.json" --candidate-manifest release-candidate.json | tee -a "$GITHUB_STEP_SUMMARY"

  promote:
    name: Release admission and promotion
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'promote'
    needs: [tooling, request]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The security admission: this job starts only after the admission authority
    # approves it in this protected environment (required reviewer, main only, no
    # administrator bypass). The first step reads the rules and the approval back and
    # fails closed if either is missing, so an unprotected or absent environment is
    # never an approval.
    environment: release-admission
    permissions:
      contents: write        # read the candidate draft; create the release draft
      actions: read          # run record, environment rules and the approval record
      id-token: write
      attestations: write
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release stages run only from main." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false   # the token is passed only to the steps that call the API
      - name: Authenticate the dispatch and the environment approval
        id: admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: tooling
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          gh api "$api/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          gh api "$api/environments/release-admission" > "$RUNNER_TEMP/environment.json"
          gh api "$api/environments/release-admission/deployment-branch-policies" > "$RUNNER_TEMP/branch-policies.json"
          gh api "$api/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/approvals.json"
          python3 infrastructure/release/release.py admission-request --event "$GITHUB_EVENT_PATH" \
            --run-record "$RUNNER_TEMP/run.json" --output "$RUNNER_TEMP/dispatch.json"
          python3 infrastructure/release/release.py admission-approval --environment "$RUNNER_TEMP/environment.json" \
            --branch-policies "$RUNNER_TEMP/branch-policies.json" --approvals "$RUNNER_TEMP/approvals.json" \
            --output "$RUNNER_TEMP/approval.json"
          read -r tag version < <(python3 -c 'import json,sys; r=json.load(open(sys.argv[1]))["request"]; print(r["candidate"], r["version"])' "$RUNNER_TEMP/dispatch.json")
          bash infrastructure/release/release.sh version-unused "$version"
          bash infrastructure/release/release.sh draft-download "$tag" "$RUNNER_TEMP/candidate"
          { echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - name: Verify the candidate attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          python3 "$GITHUB_WORKSPACE/tooling/infrastructure/release/release.py" verify-package . --kind candidate \
            --allow-extra release-candidate.sigstore.json
          # Exact signer identity (release.yml run for refs/heads/main) and the main
          # commit the candidate manifest names as its tooling.
          tooling_sha="$(python3 -c 'import json; print(json.load(open("release-candidate.json"))["tooling"]["sha"])')"
          [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "The candidate manifest names no tooling commit." >&2; exit 1; }
          attest=(--repo "$GITHUB_REPOSITORY" --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
                  --source-ref refs/heads/main --source-digest "$tooling_sha" --deny-self-hosted-runners)
          for file in release-candidate.json "$(python3 -c 'import json; print(json.load(open("release-candidate.json"))["archive"]["name"])')" mc-source.tar.gz; do
            gh attestation verify "$file" "${attest[@]}" >/dev/null
            gh attestation verify "$file" "${attest[@]}" --bundle release-candidate.sigstore.json >/dev/null
          done
          echo "Candidate manifest, archive and mc source carry a valid release.yml attestation from main."
      - name: Record the security admission
        id: decide
        shell: bash
        working-directory: tooling
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admission"
          python3 infrastructure/release/release.py admission-decide --dispatch "$RUNNER_TEMP/dispatch.json" \
            --approval "$RUNNER_TEMP/approval.json" --candidate-manifest "$RUNNER_TEMP/candidate/release-candidate.json" \
            --codeowners .github/CODEOWNERS --output "$RUNNER_TEMP/admission/admission.json"
          rev="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_revision"])' "$RUNNER_TEMP/admission/admission.json")"
          git merge-base --is-ancestor "$rev" origin/main || { echo "The admitted revision is not on main." >&2; exit 1; }
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - name: Attest the admission before any candidate image runs
        id: seal
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/admission/admission.json
      - name: Verify the admission attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.seal.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 0644 "$BUNDLE" "$RUNNER_TEMP/admission/admission.sigstore.json"
          gh attestation verify "$RUNNER_TEMP/admission/admission.json" --repo "$GITHUB_REPOSITORY" \
            --bundle "$RUNNER_TEMP/admission/admission.sigstore.json" \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > "$RUNNER_TEMP/seal-verification.json"
          python3 "$GITHUB_WORKSPACE/tooling/infrastructure/release/release.py" check-attestation-run \
            --verification "$RUNNER_TEMP/seal-verification.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
      - name: Check out the admitted source revision
        shell: bash
        env:
          REV: ${{ steps.decide.outputs.revision }}
        working-directory: tooling
        run: git worktree add --detach "$GITHUB_WORKSPACE/source" "$REV"
      - name: Enable the containerd image store
        shell: bash
        run: bash tooling/infrastructure/release/release.sh enable-containerd-store
      - name: Verify the admission, rescan, promote and run deploy.sh on the release archive
        shell: bash
        run: |
          set -euo pipefail
          bash tooling/infrastructure/release/release.sh release-package "$RUNNER_TEMP/candidate" "$GITHUB_WORKSPACE/source" \
            "$RUNNER_TEMP/release" "$RUNNER_TEMP/admission/admission.json" false "$GITHUB_WORKSPACE/tooling" \
            "$RUNNER_TEMP/admission/admission.sigstore.json"
      - name: Attest the release package
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Store the release in a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.admission.outputs.version }}
          REV: ${{ steps.decide.outputs.revision }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 0644 "$BUNDLE" "$RUNNER_TEMP/release.sigstore.json"
          python3 tooling/infrastructure/release/release.py summary "$RUNNER_TEMP" RELEASE > "$RUNNER_TEMP/notes.md"
          bash tooling/infrastructure/release/release.sh draft-create "$VERSION" "$REV" "CodeMastery $VERSION (draft; not deployed)" \
            "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release" "$RUNNER_TEMP/release.sigstore.json"
      - name: Summarize the promotion
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 tooling/infrastructure/release/release.py summary "$RUNNER_TEMP" RELEASE | tee -a "$GITHUB_STEP_SUMMARY" || true
