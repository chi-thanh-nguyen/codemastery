name: CI VM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-script:
    name: VM deployment script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check VM test script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in infrastructure/vm/tests/*.sh; do
            bash -n "$script"
          done
      - name: Check frontend staging cleanup regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n infrastructure/vm/tests/test-frontend-stage-cleanup.sh
          bash infrastructure/vm/tests/test-frontend-stage-cleanup.sh
      - name: Check shell syntax and authorization gates
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-syntax-and-authorization-gates.sh
      - name: Check offline Compose and provisioning safety guards
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-offline-compose-guards.sh
      - name: Check the runtime privilege matrix and its contract record
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-privilege-matrix-contract.sh
      - name: Check env-file custody
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-env-file-custody.sh
      - name: Check preflight against rendered Compose
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-preflight-rendered-compose.sh
      - name: Check release archive identity models
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-release-archive-identity.sh
      - name: Check image identity through a real save/load round trip
        shell: bash
        run: exec bash infrastructure/vm/tests/test-deploy-image-identity-roundtrip.sh

  deployment-script-postgres:
    name: VM deployment PostgreSQL and containment tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the runtime privilege matrix on the real schema and failure containment
        shell: bash
        run: exec bash infrastructure/vm/tests/test-postgres-privilege-matrix-containment.sh
      - name: Exercise published-port verification against real containers
        shell: bash
        run: exec bash infrastructure/vm/tests/test-postgres-published-ports.sh
      - name: Check the PostgreSQL image refuses a data volume it did not initialize
        shell: bash
        run: exec bash infrastructure/vm/tests/test-postgres-foreign-volume-guard.sh
      - name: Check the PostgreSQL image is byte-clean and equivalent to its layered build
        shell: bash
        run: exec bash infrastructure/vm/tests/test-postgres-image-layer-equivalence.sh

  deployment-script-runtime:
    name: VM runtime privileges with the real backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image from this revision
        shell: bash
        # Quiet on success. A `-q` build used to print only "Dockerfile:10 ... exit
        # code: 1" on failure, so the step keeps the plain build log and prints its
        # last 80 lines when the build fails: a Maven Wrapper download error, a
        # dependency resolution error and a compile error then read differently.
        # The exit status is Docker's own. No build argument carries a secret.
        run: |
          log="$(mktemp)"; status=0
          BUILDKIT_PROGRESS=plain docker build -t codemastery-backend:privilege-test backend >"$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "docker build of backend failed (exit $status); last 80 lines of the build log:" >&2
            tail -n 80 "$log" >&2
          fi
          rm -f "$log"
          exit "$status"
      - name: Exercise real Auth, catalogue and membership under the approved matrix
        shell: bash
        run: exec bash infrastructure/vm/tests/test-runtime-real-backend-privileges.sh

  deployment-script-containerd:
    name: VM deployment containerd image store
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enable the containerd image store
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("/etc/docker/daemon.json")
          text = path.read_text() if path.exists() else ""
          config = json.loads(text) if text.strip() else {}
          config.setdefault("features", {})["containerd-snapshotter"] = True
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          sudo systemctl restart docker
          for attempt in {1..30}; do
            docker info >/dev/null 2>&1 && break
            sleep 2
          done
          store="$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')"
          [[ "$store" == io.containerd.snapshotter.v1 ]] || { echo "containerd image store is not active: '$store'" >&2; exit 1; }
          docker version --format 'Docker Engine {{.Server.Version}}, {{.Server.Os}}/{{.Server.Arch}}, image store '"$store"
      - name: Verify registry archives through real save/load round trips
        shell: bash
        run: exec bash infrastructure/vm/tests/test-containerd-archive-roundtrip.sh

  deployment-ingress:
    name: VM HTTPS ingress
    runs-on: ubuntu-24.04
    env:
      FRONTEND_RELEASE_IMAGE: codemastery-ci/frontend:release
      FRONTEND_LOCAL_IMAGE: codemastery-ci/frontend:local
      BACKEND_IMAGE: codemastery-ci/backend:ingress-test
    steps:
      - uses: actions/checkout@v7
      - name: Verify Maven distribution integrity offline
        shell: bash
        run: exec bash infrastructure/vm/tests/test-maven-bootstrap.sh
      - name: Build the release and local images; reject invalid release origins
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ingress-release-image-build.sh
      - name: Check the release image CA store against the deployed public chain
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ingress-release-ca-store.sh
      - name: Exercise the HTTPS ingress against a stub backend
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ingress-stub-backend.sh
      - name: Exercise the HTTPS ingress with the real backend
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ingress-real-backend.sh
      - name: Run DP01 preflight with the committed override and certificate layout
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ingress-dp01-preflight.sh

  minio-initializer:
    name: VM MinIO initializer qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pull the digest-pinned MinIO servers and client
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          # Local-only Community pins: the golithus server is the local baseline;
          # the client is the initializer's base.
          mapfile -t pins < <(sed -n 's/^    image: \(ghcr\.io\/golithus\/.*\)$/\1/p' infrastructure/docker-compose.yml)
          [[ ${#pins[@]} -eq 2 ]] || { echo "Unexpected MinIO image pins." >&2; exit 1; }
          # The Chainguard release-server candidate, pinned by digest in the suite.
          mapfile -t candidate < <(sed -n "s/^CHAINGUARD_SERVER_IMAGE='\(cgr\.dev\/chainguard\/minio@sha256:[0-9a-f]\{64\}\)'$/\1/p" infrastructure/minio/test-minio-init.sh)
          [[ ${#candidate[@]} -eq 1 ]] || { echo "Unexpected Chainguard MinIO pin." >&2; exit 1; }
          for ref in "${pins[@]}" "${candidate[@]}"; do
            for attempt in 1 2 3; do
              if pull_output="$(docker pull -q --platform linux/amd64 "$ref" 2>&1)"; then
                break
              else
                status=$?
              fi
              printf '%s\n' "$pull_output" >&2
              if (( attempt == 3 )) || ! grep -Eq '^Error response from daemon: received unexpected HTTP status: (500|502|503|504)([[:space:]]|$)' <<< "$pull_output"; then
                exit "$status"
              fi
              delay=$((5 * attempt))
              printf 'Transient registry response for %s; retrying pull in %ss.\n' "$ref" "$delay" >&2
              sleep "$delay"
            done
          done
      # One job keeps the required check name; all three servers run the same suite.
      - name: Build the initializer image and run it against disposable golithus MinIO servers
        shell: bash
        run: infrastructure/minio/test-minio-init.sh
      - name: Run the same suite against disposable Chainguard MinIO candidate servers
        # Also reported when the golithus run fails; the job still fails.
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        shell: bash
        env:
          MINIO_INIT_TEST_SERVER: chainguard
        run: infrastructure/minio/test-minio-init.sh
      - name: Build the minimal MinIO server candidate from the Chainguard pin
        id: minimal
        # Built and run even when an earlier suite fails; the job still fails.
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        shell: bash
        # No build context: the Dockerfile copies only from its pinned source stage.
        # Local non-release tag, never pushed.
        run: docker build --platform linux/amd64 -t codemastery-test/minio-server:qualification - < infrastructure/vm/Dockerfile.minio-server
      - name: Run the same suite against disposable minimal MinIO candidate servers
        if: ${{ !cancelled() && steps.minimal.outcome == 'success' }}
        shell: bash
        env:
          MINIO_INIT_TEST_SERVER: minimal
        run: infrastructure/minio/test-minio-init.sh

  continuous-deployment:
    name: VM continuous deployment and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests of the SSH deployment and recovery tooling (OpenSSL 3 crypto cases included)
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          for script in infrastructure/vm/cd/*.sh infrastructure/vm/host/codemastery-ops infrastructure/vm/host/codemastery-ssh-gate; do
            bash -n "$script"
          done
          python3 -m unittest -v infrastructure/vm/tests/test_deployment_recovery_units.py
      - name: SSH transport, forced-command gate and VM-side upload/tooling gates
        shell: bash
        run: exec bash infrastructure/vm/tests/test-ssh-deployment-gates.sh
      - name: Recovery capture, publication, isolated restore and fault injection
        shell: bash
        run: exec bash infrastructure/vm/tests/test-recovery-roundtrip.sh
      - name: The same round trip with the VM's host GNU tar capture mode, as root
        shell: bash
        run: sudo env "PATH=$PATH" TAR_MODE=host bash infrastructure/vm/tests/test-recovery-roundtrip.sh
