<svg xmlns="http://www.w3.org/2000/svg" viewBox="275 247 702 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CodeMastery</title>
  <desc id="desc">CodeMastery monogram: refined geometrical C with two identically long milestone connectors.</desc>
  <defs>
