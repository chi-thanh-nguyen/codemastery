  <path fill="url(#blue)" d="M 744.089 578.457 L 811.367 540.793 L 825.045 565.225 L 757.766 602.889 Z"/>
  <ellipse cx="505.778" cy="727.914" rx="56.015" ry="54.467" fill="url(#light)"/>
  <ellipse cx="689.755" cy="624.919" rx="62.824" ry="59.971" fill="url(#blue)"/>
  <ellipse cx="881.197" cy="517.745" rx="65.041" ry="61.682" fill="url(#light)"/>
