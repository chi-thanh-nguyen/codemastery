    <linearGradient id="light" x1="450" y1="755" x2="945" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#439CF4"/>
      <stop offset="1" stop-color="#4298F3"/>
    </linearGradient>
  </defs>
