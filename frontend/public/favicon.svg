    L 640 983
    Q 610 1007 553 991
    L 322 856
    Q 286 831 286 774
    L 286 481
    Q 286 439 328 414
    Z"/>
  <!-- Independent lower-right stroke; straight edges and reference-faithful terminals. -->
  <path fill="url(#blue)" d="M 612 853
